<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAX · 数据生成</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#16374c;font:15px system-ui}header{padding:22px 28px;background:white;border-bottom:1px solid #d6e1e7}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6;margin:6px 0;color:#536b7b}nav{padding:12px 28px;display:flex;gap:10px}button,select,input{font:inherit;border:1px solid #bdcfd9;border-radius:7px;padding:9px;background:white;color:#16374c}button{cursor:pointer}button.active,button.primary{background:#146f72;color:white;border-color:#146f72}button:disabled{opacity:.55;cursor:wait}main{padding:0 28px 24px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,section.panel{background:white;border:1px solid #d7e2e8;border-radius:10px;padding:16px}.card strong{display:block;margin:8px 0}.badge{color:#627c8a;font-size:12px}.layout{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:16px}label{display:block;margin:10px 0}label span{display:block;margin-bottom:6px}input,select{width:100%}.buttons{display:flex;gap:8px;margin-top:16px}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,monospace}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #e3ebef}.muted{color:#627c8a}.error{color:#a53039}#notice{padding:10px 0;min-height:36px}#library-frame{width:100%;height:calc(100vh - 190px);border:0}[hidden]{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.stages{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header><h1>数据生成</h1><p>从来源参考到独立发布，统一记录候选、硬约束、物理结果和来源链。</p></header>
<nav><button id="workflow-tab" class="active">生成任务</button><button id="library-tab">已有900段 · 数据预览</button></nav>
<main id="workflow"><div class="stages" id="stages"></div><div class="layout"><section class="panel"><h2 style="font-size:18px;margin-top:0">生成方式</h2>
<label><span>来源</span><select id="method"><option value="augment_existing">已有900段：轨迹扰动＋速度变化</option></select></label>
<label><span>平滑关节扰动档位 / rad</span><input id="amplitude" value="0.06, 0.10, 0.16"></label>
<label><span>速度倍率，用逗号分隔</span><input id="speeds" value="0.3, 0.6, 1, 1.6, 2.4"></label>
<p class="muted">扰动：最多5档，0～0.3 rad（不含0）；0.1 rad≈5.73°。速度：最多10档，0.1～3倍。</p>
<label><span>本批候选数量上限（留空使用全部组合）</span><input id="candidate-count" type="number" value="4500" min="1" max="100000"></label>
<label><span>每片段每档变体数</span><input id="variants" type="number" value="1" min="1" max="20"></label>
<label><span>随机种子</span><input id="seed" type="number" value="20261104" min="0" max="2147483647"><button id="new-seed" type="button">换一个随机种子</button></label>
<p>肘下构型与自碰撞为必经准入项；改变速度后重新检查几何和时序，实际仿真状态也要独立检查。</p>
<div class="buttons"><button id="preview">核验配置</button><button id="create">仅保存配方</button><button id="start" class="primary">建立并开始生成</button></div>
<p class="muted">按上方输入保存配方；点击“建立并开始生成”后，后台执行并更新进度。候选总数不等于最终合格条数。参考速度≤0.85rad/s、加速度≤1.5rad/s²；jerk与跟踪误差单列诊断。</p></section>
<section class="panel"><h2 style="font-size:18px;margin-top:0">任务计划与进度</h2><p id="capability">加载中…</p><div id="notice" role="status"></div><div id="estimate">先核验配置，查看来源数量、候选数与待定阈值。</div>
<h3 style="font-size:16px;margin-top:24px">已有任务</h3><table><thead><tr><th>任务</th><th>计划候选</th><th>状态</th><th>查看</th></tr></thead><tbody id="jobs"></tbody></table><pre id="detail"></pre></section></div></main>
<section id="library" hidden><label style="margin:8px 28px">选择数据发布<select id="library-dataset"><option value="">原始900段</option></select></label><iframe id="library-frame" src="about:blank" title="已有合成数据预览"></iframe></section>
<script type="module">
const $=id=>document.getElementById(id);const limitNames={velocity_rad_s:'速度上限',acceleration_rad_s2:'加速度上限',jerk_rad_s3:'jerk上限',tracking_rmse_m:'跟踪RMSE门槛',tracking_p95_m:'跟踪p95门槛'};const stageNames={prepare:'来源与配方',geometry:'几何轨迹',validate:'时序与物理',publish:'独立发布'};const names={pending:'未开始',completed:'已完成',blocked:'未接通',running:'执行中',failed:'失败',awaiting_adapter:'配方已建立 · 等待执行器',planned:'计划已冻结',ready:'待下一阶段',published:'独立发布完成'};
async function api(path,data){const r=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const obj=await r.json();if(!r.ok)throw Error(obj.error||'请求失败');return obj}
function numbers(id,label,min,max,count){const tokens=$(id).value.split(/[,，;；\n]/).map(x=>x.trim());if(!tokens.length||tokens.length>count||tokens.some(x=>!x))throw Error(`${label}应为1～${count}个数值，用逗号分隔`);const values=tokens.map(Number);if(values.some(x=>!Number.isFinite(x)||x<min||x>max)||(id==='amplitude'&&values.some(x=>x===0)))throw Error(`${label}范围${min}～${max}${id==='amplitude'?'（不含0）':''}`);if(new Set(values).size!==values.length)throw Error(`${label}不能重复`);return values}
function config(){const amplitudes=numbers('amplitude','扰动幅度',0,0.3,5),speeds=numbers('speeds','速度倍率',0.1,3,10);const count=$('candidate-count').value.trim();const cfg={method:'augment_existing',perturbation_levels_rad:amplitudes,speed_factors:speeds,candidate_count:count?Number(count):null,screening_profile:'reference_plus_physics_diagnostics',limits:{velocity_rad_s:0.85,acceleration_rad_s2:1.5,jerk_rad_s3:null,tracking_rmse_m:null,tracking_p95_m:null},variants_per_clip:Number($('variants').value),seed:Number($('seed').value)};if(count&&(!Number.isInteger(cfg.candidate_count)||cfg.candidate_count<1||cfg.candidate_count>100000))throw Error('候选总数应为1～100000的整数');if(!Number.isInteger(cfg.variants_per_clip)||cfg.variants_per_clip<1||cfg.variants_per_clip>20)throw Error('变体数应为1～20');if(!Number.isInteger(cfg.seed)||cfg.seed<0||cfg.seed>2147483647)throw Error('随机种子范围0～2147483647');return cfg}
let selectedJob=null;
async function safe(fn){$('notice').textContent='正在处理…';$('notice').className='';for(const id of ['preview','create','start'])$(id).disabled=true;try{await fn();$('notice').textContent='完成'}catch(e){$('notice').textContent=e.message;$('notice').className='error'}finally{for(const id of ['preview','create','start'])$(id).disabled=false}}

function estimate(p){$('estimate').replaceChildren();for(const text of [`来源 ${p.source_clips} 段`,`扰动：${p.config.perturbation_levels_rad.join("、")} rad（约${p.config.perturbation_levels_rad.map(x=>(x*180/Math.PI).toFixed(2)).join("、")}°）`,`速度：${p.config.speed_factors.map(x=>x+"×").join("、")}`,`计划 ${p.planned_candidates} 个候选（合格数量由筛查决定）`,`筛查前估计时长 ${(p.estimated_reference_seconds_before_rejection/3600).toFixed(2)} 小时`,`待冻结：${p.unresolved_limits.map(k=>limitNames[k]||k).join('、')||'无'}`]){const el=document.createElement('p');el.textContent=text;$('estimate').append(el)}}
function detail(job){selectedJob=job.job_id;$('detail').textContent=`任务 ${job.job_id}\n${names[job.status]||job.status}\n`+Object.entries(job.stages).map(([s,v])=>`${stageNames[s]||s}：${names[v.status]||v.status}${v.reason?' / '+v.reason:''}`).join('\n')+(job.progress?'\n进度：'+JSON.stringify(job.progress):'')+(job.execution?'\n实际执行：'+JSON.stringify(job.execution):'')+`\n任务扰动：${job.config?.perturbation_levels_rad?.join('、')||'历史配置'} rad\n任务速度：${job.config?.speed_factors?.join('、')||'历史配置'} 倍\n计划：${job.plan_path}\n发布：${job.release_path||'尚无发布数据'}`}
async function jobs(){const r=await api('/api/generation/jobs');$('jobs').replaceChildren();for(const job of r.jobs){const tr=document.createElement('tr');for(const text of [job.job_id.slice(0,10),job.planned_candidates,names[job.status]||job.status]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看';b.onclick=()=>safe(async()=>detail(await api('/api/generation/job?id='+job.job_id)));td.append(b);if(job.status==='awaiting_adapter'||job.status==='ready'){const run=document.createElement('button');run.textContent='开始执行';run.onclick=()=>safe(async()=>{detail(await api('/api/generation/start',{job_id:job.job_id}));await jobs()});td.append(run)}tr.append(td);$('jobs').append(tr)}const published=r.jobs.filter(j=>j.status==='published');const current=$('library-dataset').value;$('library-dataset').replaceChildren(new Option('原始900段',''),...published.map(j=>new Option('增强发布 '+j.job_id.slice(0,10)+' · '+(j.execution?.admitted??'')+'段',j.job_id)));if(published.some(j=>j.job_id===current))$('library-dataset').value=current;if(!r.jobs.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='尚无生成任务';tr.append(td);$('jobs').append(tr)}}
$('preview').onclick=()=>safe(async()=>estimate(await api('/api/generation/preview',config())));
$('start').onclick=()=>safe(async()=>{const values=config();estimate(await api('/api/generation/preview',values));const job=await api('/api/generation/create',values);detail(job);detail(await api('/api/generation/start',{job_id:job.job_id}));await jobs()});
$('new-seed').onclick=()=>{$('seed').value=crypto.getRandomValues(new Uint32Array(1))[0]%2147483648};$('new-seed').click();
$('create').onclick=()=>safe(async()=>{const job=await api('/api/generation/create',config());detail(job);await jobs()});
function tab(library){$('workflow').hidden=library;$('library').hidden=!library;$('workflow-tab').classList.toggle('active',!library);$('library-tab').classList.toggle('active',library);if(library&&$('library-frame').getAttribute('src')==='about:blank')$('library-frame').src='/data-generation/library'}
$('library-dataset').onchange=()=>{$('library-frame').src='/data-generation/library'+($('library-dataset').value?'?job='+$('library-dataset').value:'')};setInterval(()=>{jobs().catch(()=>{});if(selectedJob)api('/api/generation/job?id='+selectedJob).then(detail).catch(()=>{})},5000);$('workflow-tab').onclick=()=>tab(false);$('library-tab').onclick=()=>tab(true);
try{const p=await api('/api/generation/pipeline');$('capability').textContent=p.execution_note;for(let i=0;i<p.stages.length;i++){const s=p.stages[i],card=document.createElement('div');card.className='card';const badge=document.createElement('span');badge.className='badge';badge.textContent=`阶段 ${i+1}`;const title=document.createElement('strong');title.textContent=s.label;const status=document.createElement('span');status.className='muted';status.textContent=s.id==='prepare'?'来源核验与配方可用':s.id==='geometry'?'扰动与硬几何检查已接通':s.id==='validate'?'变速与实际物理检查已接通':'独立发布接口可用';card.append(badge,title,status);$('stages').append(card)}await jobs()}catch(e){$('notice').textContent=e.message;$('notice').className='error'}
</script></body></html>
